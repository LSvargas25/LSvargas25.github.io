<div #note class="sticky-note">
  <div class="tape"></div>

  <div class="note-content">
    <p class="note-text">
      <span #textLine class="text-line">
        <!-- helpers -->
        <span #inkDot class="ink-dot" aria-hidden="true"></span>
        <span #eraseDust class="erase-dust" aria-hidden="true"></span>
        <span #caret class="caret" aria-hidden="true"></span>

        <!-- pencil -->
        <span #pencil class="pencil" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="pencil-svg">
            <rect x="10" y="28" width="38" height="8" rx="3" fill="#f4c542"/>
            <polygon points="48,28 58,32 48,36" fill="#d2b48c"/>
            <polygon points="58,32 62,32 58,34" fill="#333"/>
            <rect x="6" y="26" width="6" height="12" rx="2" fill="#e06c75"/>
            <rect x="12" y="26" width="2" height="12" fill="#c0c0c0"/>
          </svg>
        </span>

        <!-- characters -->
        <span
          class="char"
          *ngFor="let c of messageChars(); let i = index"
          [attr.data-i]="i"
        >
          {{ c === ' ' ? '\u00A0' : c }}
        </span>
      </span>
    </p>

    <!-- Resume Button -->
    <button
      #resumeBtn
      type="button"
      class="note-btn"
      (click)="openResume()"
      [attr.aria-label]="'note.resumeAria' | translate"
      aria-haspopup="dialog"
      [attr.aria-expanded]="isResumeOpen()"
    >
      <span class="btn-inner">
        <!-- LEFT ICON: document/sheet -->
        <span class="btn-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path
              d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M14 3v4h4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M9 12.5h6M9 15.8h6M9 9.2h2.2"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <!-- LABEL -->
        <span class="btn-label">{{ 'note.button.resume' | translate }}</span>

        <!-- RIGHT MICRO DOTS (premium detail) -->
        <span class="btn-spark" aria-hidden="true"></span>
      </span>
    </button>
  </div>
</div>
