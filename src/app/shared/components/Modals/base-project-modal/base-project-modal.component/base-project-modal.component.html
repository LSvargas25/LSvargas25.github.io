<div *ngIf="isOpen"
     class="modal-overlay flex items-center justify-center"
     role="dialog"
     aria-modal="true"
     [attr.aria-labelledby]="labelledBy() || null">
  <!-- BACKDROP -->
  <div class="expande-modal-backdrop" (click)="close()"></div>

  <!-- CLOSE BUTTON -->
  <button
    #closeButton
    type="button"
    (click)="close()"
    class="fixed z-[10001] w-12 h-12 flex items-center justify-center rounded-full text-3xl font-bold text-white transition-all duration-300 hover:scale-110 active:scale-95"
    [ngClass]="closeButtonTopClass()"
    style="
      background: radial-gradient(circle at top left, #1f2937, #020617);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    "
    [attr.aria-label]="'modal.close' | translate"
  >
    &times;
  </button>

  <!-- CONTENT (NO SIZE HERE) -->
  <div
    class="bg-transparent p-4 md:p-8 relative flex flex-col z-[10000] max-h-[100dvh] md:max-h-[90vh] overflow-y-auto"
    (click)="stop($event)"
  >
    <ng-content></ng-content>
  </div>
</div>
