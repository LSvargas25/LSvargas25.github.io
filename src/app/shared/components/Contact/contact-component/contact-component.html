<section class="relative px-6 overflow-x-clip">

  <div class="max-w-3xl mx-auto text-center relative z-20">

    <!-- HEADER -->
    <div class="Contact-header">
      <h2 class="Contact-title">
        {{ 'contact.title' | translate }}
        <span class="Contact-line"></span>
      </h2>
    </div>

    <p class="text-lg text-gray-500 mt-1">
      {{ 'contact.intro' | translate }}
    </p>

    <!-- FORM -->
    <form (submit)="sendEmail($event)" class="contact-form mt-6">

      <!-- NAME + EMAIL (side by side from 640px) -->
      <div class="form-row">
        <!-- NAME -->
        <div class="form-group">
          <input id="contact-name" type="text" name="from_name" required maxlength="80" autocomplete="name" />
          <label for="contact-name">{{ 'contact.fullName' | translate }}</label>
          <span class="focus-border"></span>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <input id="contact-email" type="email" name="from_email" required maxlength="120" autocomplete="email" inputmode="email" />
          <label for="contact-email">{{ 'contact.email' | translate }}</label>
          <span class="focus-border"></span>
        </div>
      </div>

      <!-- Honeypot: invisible to people and assistive tech; bots tend to fill it -->
      <div class="form-trap" aria-hidden="true">
        <label for="contact-company">Company</label>
        <input id="contact-company" type="text" name="company" tabindex="-1" autocomplete="off" />
      </div>

      <!-- MESSAGE -->
      <div class="form-group">
        <textarea id="contact-message" name="message" rows="3" required maxlength="2000"></textarea>
        <label for="contact-message">{{ 'contact.message' | translate }}</label>
        <span class="focus-border"></span>
      </div>

      <!-- BUTTON -->
     <button
    type="submit"
    class="contact-button"
    [disabled]="state === 'sending'">

    <span *ngIf="state === 'idle'">
      {{ 'contact.send' | translate }}
    </span>

    <span *ngIf="state === 'sending'" class="spinner-wrapper">
      <span class="spinner"></span>
      {{ 'contact.sending' | translate }}
    </span>

  </button>

  <!-- PREMIUM TOAST -->
  <div
    class="toast"
    *ngIf="toastVisible"
    [ngClass]="toastType">

    <div class="toast-icon">
      <span *ngIf="toastType === 'success'">✓</span>
      <span *ngIf="toastType === 'error'">!</span>
    </div>

    <span class="toast-message">
      {{ toastMessage }}
    </span>

  </div>

</form>

  </div>
</section>
